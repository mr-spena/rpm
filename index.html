/* ---------- Modul ---------- */
const SYS=()=>`Anda adalah konsultan administrasi guru profesional untuk Kurikulum Merdeka/Kurikulum Mendalam (Deep Learning) di Indonesia. Tulis dalam Bahasa Indonesia baku (istilah mapel boleh Inggris). Patuhi regulasi: CP mengacu Keputusan BSKAP No. 046/H/KR/2025, istilah "murid", Dimensi Profil Lulusan (DPL). Keluaran WAJIB berupa Markdown: gunakan tabel Markdown untuk data tabular, jangan memakai blok kode, jangan menulis kalimat pembuka atau penutup, dan jangan menambahkan tanda tangan (sudah ditambahkan aplikasi). Jangan mengarang data kalender: jika data tidak cukup, tulis asumsi di baris "Catatan".

{id:'sumatif',n:'8. Soal & Asesmen',s:'Soal',desc:'Ulangan harian, STS, SAS beserta kisi-kisi, kunci jawaban, dan rubrik.',
 f:[{k:'jenis',t:'sel',l:'Jenis',o:['Ulangan Harian','Sumatif Tengah Semester (STS)','Sumatif Akhir Semester (SAS)']},{k:'pg',t:'num',l:'Pilihan ganda',v:10},{k:'up',t:'num',l:'Uraian pendek',v:5},{k:'ul',t:'num',l:'Uraian panjang',v:0},{k:'cakupan',t:'area',l:'Materi/cakupan',ph:'Mis. Recount text, Simple Past Tense, 5W1H'},{k:'file',t:'file',l:'Bahan/RPM (opsional)'}],

/* ---------- AI ---------- */
async function fileParts(f){
 if(!f)return[];
 const n=f.name.toLowerCase(),buf=await f.arrayBuffer();
 if(f.type.startsWith('image/')||f.type==='application/pdf'){
  let b='';const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=8192)b+=String.fromCharCode(...u.subarray(i,i+8192));
  return[{inlineData:{mimeType:f.type,data:btoa(b)}}]}
 if(/\.(xlsx|xls|csv)$/.test(n)){const wb=XLSX.read(buf);return[{text:'Isi berkas Excel '+f.name+':\n'+wb.SheetNames.map(s=>'## '+s+'\n'+XLSX.utils.sheet_to_csv(wb.Sheets[s])).join('\n')}]}
 if(/\.docx$/.test(n)){const r=await mammoth.extractRawText({arrayBuffer:buf});return[{text:'Isi berkas Word '+f.name+':\n'+r.value}]}
 if(/\.(txt|md)$/.test(n))return[{text:await f.text()}];
 throw new Error('Format berkas '+f.name+' belum didukung. Pakai gambar, PDF, Excel, Word (.docx), atau txt.')}
async function callAI(parts){
 const key=LS.get(K.key,'');if(!key)throw new Error('API key Gemini belum diisi. Buka Pengaturan, tempel API key dari Google AI Studio.');
 const model=LS.get(K.model,'gemini-2.5-flash');
 const url='https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent';
 const body=JSON.stringify({systemInstruction:{parts:[{text:SYS()}]},contents:[{role:'user',parts}],generationConfig:{temperature:.6,maxOutputTokens:32768}});
 let last;
 for(let i=0;i<3;i++){
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body});
  if(r.ok){const j=await r.json();const t=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');if(!t)throw new Error('AI tidak mengembalikan teks'+(j.promptFeedback?.blockReason?' (diblokir: '+j.promptFeedback.blockReason+')':'')+'. Coba ulangi.');return t}
  let m='';try{m=(await r.json()).error?.message||''}catch(e){}
  last=new Error('Gemini menolak permintaan ('+r.status+'): '+m);
  if(r.status!==429&&r.status<500)throw last;
  await new Promise(s=>setTimeout(s,1500*(i+1)))}
 throw last}

/* ---------- Markdown, konteks, tanda tangan ---------- */
function md(s){
 s=s.replace(/^```\w*\n?|```$/gm,'').trim();const L=s.split('\n');let o='',i=0;
 const inl=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*(?!\s)(.+?)\*/g,'$1<i>$2</i>').replace(/&lt;br\s*\/?&gt;/g,'<br>');
 const cells=l=>l.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
 while(i<L.length){const l=L[i];
  if(/^\s*\|/.test(l)&&/^\s*\|?\s*:?-{2,}/.test(L[i+1]||'')){
   const h=cells(l);i+=2;let rows=[];while(i<L.length&&/^\s*\|/.test(L[i]))rows.push(cells(L[i++]));
   o+='<table><thead><tr>'+h.map(c=>'<th>'+inl(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>{
     const only=r.filter(Boolean);const sp=only.length===1&&r.length>2&&r[0];
     return sp?'<tr><td colspan="'+h.length+'"><b>'+inl(r[0])+'</b></td></tr>':'<tr>'+h.map((_,k)=>'<td>'+inl(r[k]||'')+'</td>').join('')+'</tr>'}).join('')+'</tbody></table>';continue}
  let m;
  if(m=l.match(/^(#{1,4})\s+(.*)/)){o+='<h'+Math.min(m[1].length+1,4)+'>'+inl(m[2])+'</h'+Math.min(m[1].length+1,4)+'>'}
  else if(/^\s*([-*]|\d+[.)])\s+/.test(l)){const ord=/^\s*\d/.test(l);let it='';while(i<L.length&&/^\s*([-*]|\d+[.)])\s+/.test(L[i]))it+='<li>'+inl(L[i++].replace(/^\s*([-*]|\d+[.)])\s+/,''))+'</li>';o+=(ord?'<ol>':'<ul>')+it+(ord?'</ol>':'</ul>');continue}
  else if(/^\s*---+\s*$/.test(l)){o+='<hr>'}
  else if(l.trim()){o+='<p>'+inl(l)+'</p>'}
  i++}
 return o}
const txt=h=>{const d=document.createElement('div');d.innerHTML=h;return d.innerText||d.textContent||''};
function ctx(skip){
 let c='';for(const m of MODS){if(m.id===skip||!data[m.id]||['media','sumatif'].includes(m.id))continue;c+='\n\n### Data tersimpan: '+m.n+'\n'+txt(data[m.id].html).slice(0,7000)}
 return c?'\n\nGunakan data berikut yang sudah disusun guru agar dokumen konsisten (jumlah JP, TP, materi, bulan harus sinkron):'+c:''}
function sig(){
 const d=new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
 return`<div class="sig"><div>Mengetahui,<br>Kepala Sekolah ${esc(prof.sekolah)}<div class="sp"></div><b><u>${esc(prof.kepsek)}</u></b><br>${prof.nipKepsek?'NIP. '+esc(prof.nipKepsek):''}</div><div>${esc(prof.kota)}, ${d}<br>Guru Mata Pelajaran<div class="sp"></div><b><u>${esc(prof.nama)}</u></b><br>${prof.nip?'NIP. '+esc(prof.nip):''}</div></div>`}
const head=m=>`<p style="text-align:center"><b>${esc(m.n.replace(/^\d+\.\s*/,'').toUpperCase())}</b><br>${esc(prof.sekolah)} · ${esc(prof.mapel)} · Fase ${esc(prof.fase)} / Kelas ${esc(prof.kelas)}<br>Tahun Pelajaran ${esc(prof.ta)}</p>`;

/* ---------- Tampilan ---------- */
function nav(){
 const it=[['home','Beranda'],...MODS.map(m=>[m.id,m.s]),['set','Pengaturan']];
 $('#nav').innerHTML='<div class="brand"><span class="bub" style="transform:scale(.8)"></span>Mr.Spena</div><div class="pill">'+it.map(([id,l])=>'<button class="'+(tab===id?'on':'')+'" data-t="'+id+'">'+l+(data[id]?'<i class="dot"></i>':'')+'</button>').join('')+'<button id="lo">Keluar</button></div>';
 $('#nav').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;show()});
 $('#lo').onclick=()=>{sessionStorage.removeItem('spena_in');boot()};
 const on=$('#nav .on');if(on)on.scrollIntoView({inline:'center',block:'nearest'})}
function show(){nav();scrollTo(0,0);tab==='home'?home():tab==='set'?settings():module(MODS.find(m=>m.id===tab))}
function noKey(){return LS.get(K.key,'')?'':'<div class="banner"><b>API key belum diisi.</b> Tanpa API key, AI tidak bisa bekerja. <a href="#" onclick="tab=\'set\';show();return false">Buka Pengaturan</a>.</div>'}
function home(){
 const done=MODS.filter(m=>data[m.id]).length;
 $('#main').innerHTML=noKey()+'<div class="card"><h1><span class="t">Administrasi guru,</span> dari kalender sampai soal</h1><p class="muted">'+esc(prof.nama)+' · '+esc(prof.mapel)+' · Kelas '+esc(prof.kelas)+' · '+esc(prof.ta)+'</p><p>Kerjakan berurutan: tiap modul membaca hasil modul sebelumnya, jadi JP, TP, dan bulan di Prota, Promes, dan RPM tetap sinkron. Semua hasil bisa diedit langsung di layar lalu diunduh sebagai Word, Excel, atau dicetak ke PDF.</p><p><b>'+done+' dari '+MODS.length+' modul sudah terisi.</b></p></div>'+
 '<div class="grid">'+MODS.map(m=>'<div class="card" style="margin:0;display:flex;flex-direction:column;align-items:flex-start"><h3>'+m.n+'</h3><p class="muted" style="flex:1">'+m.desc+'</p><button class="btn ghost" data-go="'+m.id+'">'+(data[m.id]?'Buka hasil':'Mulai')+'</button></div>').join('')+'</div>'+
 '<div class="card" style="margin-top:16px"><h3>Cadangan data</h3><p class="muted">Data tersimpan di browser ini saja. Unduh cadangan secara berkala, atau pindahkan data ke perangkat lain.</p><div class="row"><button class="btn ghost" id="bk">Unduh cadangan (.json)</button><label class="btn ghost" style="margin:0;font-weight:600;font-size:14px;cursor:pointer">Pulihkan cadangan<input type="file" id="rs" accept=".json" class="hide"></label></div></div>';
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{tab=b.dataset.go;show()});
 $('#bk').onclick=()=>dl(new Blob([JSON.stringify({prof,data})],{type:'application/json'}),'cadangan_spena_'+new Date().toISOString().slice(0,10)+'.json');
 $('#rs').onchange=async e=>{try{const j=JSON.parse(await e.target.files[0].text());if(!j.data)throw 0;prof={...DEF,...j.prof};data=j.data;LS.set(K.prof,prof);LS.set(K.data,data);toast('Cadangan dipulihkan');show()}catch(x){toast('Berkas cadangan tidak valid',1)}}}
function module(m){
 const fld=f=>{const id='f_'+f.k,v=f.v??'';return'<div><label for="'+id+'">'+f.l+'</label>'+(
  f.t==='area'?'<textarea id="'+id+'" placeholder="'+esc(f.ph||'')+'"></textarea>':
  f.t==='sel'?'<select id="'+id+'">'+f.o.map(o=>'<option>'+esc(o)+'</option>').join('')+'</select>':
  f.t==='file'?'<input type="file" id="'+id+'" accept="image/*,.pdf,.xlsx,.xls,.csv,.docx,.txt">':
  '<input id="'+id+'" type="'+(f.t==='num'?'number':'text')+'" value="'+esc(v)+'" placeholder="'+esc(f.ph||'')+'">')+'</div>'};
 const d=data[m.id];
 $('#main').innerHTML=noKey()+'<div class="card form noprint"><h2>'+m.n+'</h2><p class="muted">'+m.desc+'</p><div class="grid">'+m.f.map(fld).join('')+'</div><div class="row" style="margin-top:14px"><button class="btn" id="go">'+(d?'Susun ulang dengan AI':'Susun dengan AI')+'</button><span class="muted" id="st"></span></div></div>'+
 '<div class="card"><div class="row noprint" style="margin-bottom:10px"><h3 style="margin:0;flex:1">Hasil <span class="muted">(klik teks untuk mengedit; tersimpan otomatis)</span></h3><button class="btn ghost" id="xw">Word</button><button class="btn ghost" id="xx">Excel</button><button class="btn ghost" id="xp">Cetak / PDF</button><button class="btn ghost" id="xc">Salin</button></div><div id="out" contenteditable="true">'+(d?d.html:'<p class="muted">Belum ada hasil. Isi form di atas lalu tekan tombol Susun dengan AI.</p>')+'</div></div>';
 const out=$('#out');
 out.oninput=()=>{const c=out.cloneNode(true);c.querySelector('.sig')?.remove();data[m.id]={...(data[m.id]||{}),html:c.innerHTML.replace(/<p style="text-align:center">.*?<\/p>/,'')};if(!data[m.id].html)return;LS.set(K.data,data)};
 if(d&&!d.html.includes('class="sig"')){}
 $('#go').onclick=async()=>{
  if(busy)return;busy=true;const b=$('#go');b.disabled=true;b.innerHTML='<span class="spin"></span> AI bekerja…';$('#st').textContent='Biasanya 20-90 detik, jangan tutup halaman.';
  try{
   const v={};m.f.forEach(f=>{const e=$('#f_'+f.k);v[f.k]=f.t==='file'?e.files[0]:e.value});
   const fp=await fileParts(v.file);
   const text=await callAI([{text:m.p(v)+ctx(m.id)},...fp]);
   data[m.id]={html:md(text),ts:Date.now()};LS.set(K.data,data);
   out.innerHTML=head(m)+data[m.id].html+sig();nav();toast('Selesai. Periksa isinya lalu edit seperlunya.')
  }catch(e){toast(e.message,1);$('#st').textContent=''}
  finally{busy=false;b.disabled=false;b.textContent='Susun ulang dengan AI'}};
 if(d)out.innerHTML=head(m)+d.html+sig();
 $('#xw').onclick=()=>exportWord(m);$('#xx').onclick=()=>exportExcel(m);$('#xp').onclick=()=>print();
 $('#xc').onclick=()=>navigator.clipboard.writeText(out.innerText).then(()=>toast('Teks disalin'))}
function settings(){
 $('#main').innerHTML='<div class="card"><h2>Profil guru & sekolah</h2><p class="muted">Dipakai di semua dokumen, termasuk kolom tanda tangan.</p><div class="grid">'+
 [['nama','Nama guru'],['nip','NIP guru'],['sekolah','Sekolah'],['mapel','Mata pelajaran'],['fase','Fase'],['kelas','Kelas'],['ta','Tahun pelajaran'],['jp','JP per minggu'],['kepsek','Kepala sekolah'],['nipKepsek','NIP kepala sekolah'],['kota','Kota (tanda tangan)']].map(([k,l])=>'<div><label for="p_'+k+'">'+l+'</label><input id="p_'+k+'" value="'+esc(prof[k])+'"></div>').join('')+
 '</div><button class="btn" id="sp" style="margin-top:14px">Simpan profil</button></div>'+
 '<div class="card"><h2>Koneksi AI (Gemini)</h2><p class="muted">Buat API key gratis di Google AI Studio (aistudio.google.com), lalu tempel di sini. Key disimpan hanya di browser ini, tidak dikirim ke GitHub. Jangan menulis key langsung di dalam file index.html.</p><div class="grid"><div><label for="k1">API key</label><input id="k1" type="password" value="'+esc(LS.get(K.key,''))+'" autocomplete="off"></div><div><label for="k2">Nama model</label><input id="k2" value="'+esc(LS.get(K.model,'gemini-2.5-flash'))+'"></div></div><div class="row" style="margin-top:14px"><button class="btn" id="sk">Simpan</button><button class="btn ghost" id="tk">Tes koneksi</button></div></div>'+
 '<div class="card"><h2>Sinkronisasi antar perangkat</h2><p class="muted">Data (profil, hasil dokumen, login) tersimpan di browser tiap perangkat. Hubungkan ke Google Drive Anda agar semua perangkat memakai data yang sama.</p><div class="grid"><div><label for="s1">URL Web App (Google Apps Script)</label><input id="s1" value="'+esc((syncCfg()||{}).u||'')+'" placeholder="https://script.google.com/macros/s/.../exec"></div><div><label for="s2">Kode rahasia</label><input id="s2" type="password" value="'+esc((syncCfg()||{}).c||'')+'" autocomplete="off"></div></div><label style="display:flex;gap:8px;align-items:center;font-weight:400;margin-top:12px"><input type="checkbox" id="s3" style="width:auto" '+((syncCfg()||{}).key?'checked':'')+'> Sertakan API key Gemini (tersimpan di Google Drive Anda)</label><div class="row" style="margin-top:14px"><button class="btn" id="ss">Simpan & uji</button><button class="btn ghost" id="su">Unggah dari perangkat ini</button><button class="btn ghost" id="sd">Ambil dari cloud</button><button class="btn ghost" id="sl">Salin tautan perangkat baru</button></div><p class="muted" id="sst" style="margin-top:10px">'+(syncCfg()?'Otomatis mengunggah 2-3 detik setelah ada perubahan. Terakhir: '+(LS.get('spena_last',0)?new Date(LS.get('spena_last')).toLocaleString('id-ID'):'belum pernah'):'Belum terhubung.')+'</p><details style="margin-top:12px"><summary style="cursor:pointer;font-weight:600">Cara membuat (sekali saja, sekitar 3 menit)</summary><ol class="muted"><li>Buka script.google.com, pilih Proyek baru.</li><li>Hapus isi awal, tempel kode di bawah, lalu ganti <b>GANTI_DENGAN_KODE_RAHASIA_ANDA</b> dengan kode panjang pilihan Anda.</li><li>Klik Deploy, Deployment baru, jenis <b>Aplikasi web</b>. Jalankan sebagai: <b>Saya</b>. Yang memiliki akses: <b>Siapa saja</b>. Deploy, lalu izinkan akses Drive.</li><li>Salin URL yang berakhiran /exec ke kolom di atas, isi kode rahasia yang sama, lalu tekan Simpan & uji dan Unggah dari perangkat ini.</li><li>Di perangkat lain, tekan Salin tautan perangkat baru di sini, lalu buka tautan itu di perangkat tujuan. Tautan berisi kode rahasia, jadi kirim hanya ke diri sendiri.</li></ol><pre id="gs" style="white-space:pre-wrap;background:var(--bg);border-radius:8px;padding:12px;font-size:12px;overflow:auto">'+esc(GS)+'</pre><button class="btn ghost" id="sc">Salin kode</button></details></div>'+
 '<div class="card"><h2>Ganti login</h2><p class="muted">Ini hanya kunci tampilan. Siapa pun yang membuka kode halaman bisa melewatinya, jadi jangan menyimpan data rahasia siswa di sini.</p><div class="grid"><div><label for="a1">Username baru</label><input id="a1"></div><div><label for="a2">Password baru</label><input id="a2" type="password"></div></div><button class="btn" id="sa" style="margin-top:14px">Simpan login</button></div>';

 const rd=()=>({u:$('#s1').value.trim(),c:$('#s2').value,key:$('#s3').checked});
 $('#ss').onclick=async()=>{const o=rd();if(!/^https:\/\/script\.google\.com\//.test(o.u)||o.c.length<6)return toast('Isi URL Web App (https://script.google.com/...) dan kode rahasia min. 6 karakter',1);LS.set('spena_sync',o);try{const j=await sCall('load');sStat(j.payload?'Terhubung. Ada data di cloud.':'Terhubung. Cloud masih kosong, tekan Unggah dari perangkat ini.');toast('Koneksi berhasil')}catch(e){sStat(e.message,1);toast(e.message,1)}};
 $('#su').onclick=async()=>{const o=rd();LS.set('spena_sync',o);localStorage.setItem('spena_ts',Date.now());await push(false)};
 $('#sd').onclick=async()=>{if(!confirm('Data di perangkat ini akan diganti dengan data dari cloud. Lanjutkan?'))return;LS.set('spena_sync',rd());try{const r=await pull(true);if(r==='kosong')return toast('Cloud masih kosong',1);toast('Data dimuat dari cloud');show()}catch(e){toast(e.message,1)}};
 $('#sl').onclick=()=>{const o=rd();if(!o.u)return toast('Isi dan simpan koneksi dulu',1);LS.set('spena_sync',o);const t=location.origin+location.pathname+'#s='+btoa(unescape(encodeURIComponent(JSON.stringify(o))));navigator.clipboard.writeText(t).then(()=>toast('Tautan disalin. Buka di perangkat baru.'))};
 $('#sc').onclick=()=>navigator.clipboard.writeText(GS).then(()=>toast('Kode disalin'));
 $('#sp').onclick=()=>{Object.keys(DEF).forEach(k=>prof[k]=$('#p_'+k).value.trim());LS.set(K.prof,prof);nav();toast('Profil disimpan')};
 $('#sk').onclick=()=>{LS.set(K.key,$('#k1').value.trim());LS.set(K.model,$('#k2').value.trim()||'gemini-2.5-flash');toast('Pengaturan AI disimpan')};
 $('#tk').onclick=async()=>{$('#sk').click();try{await callAI([{text:'Balas hanya dengan kata: siap'}]);toast('Koneksi berhasil')}catch(e){toast(e.message,1)}};
 $('#sa').onclick=async()=>{const u=$('#a1').value.trim(),p=$('#a2').value;if(u.length<3||p.length<6)return toast('Username min. 3 dan password min. 6 karakter',1);LS.set(K.auth,{u,h:await sha(p)});toast('Login diperbarui')}}

/* ---------- Ekspor ---------- */
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
const fname=(m,e)=>m.n.replace(/^\d+\.\s*/,'').replace(/\W+/g,'_')+'_'+prof.sekolah.replace(/\W+/g,'')+'.'+e;
function exportWord(m){
 const h='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>@page{size:29.7cm 21cm;mso-page-orientation:landscape;margin:1.6cm}body{font-family:"Times New Roman";font-size:11pt}table{border-collapse:collapse;width:100%}td,th{border:1px solid #000;padding:3pt;vertical-align:top}th{background:#e7eeec}</style></head><body>'+$('#out').innerHTML.replace(/<div class="sig">/,'<table style="border:0"><tr><td style="border:0;width:50%"><div class="sig">').replace(/<div class="sp"><\/div>/g,'<br><br><br>')+'</body></html>';
 dl(new Blob(['\ufeff',h],{type:'application/msword'}),fname(m,'doc'));toast('Word diunduh. Orientasi lanskap diatur otomatis.')}
function exportExcel(m){
 const t=[...$('#out').querySelectorAll('table')];if(!t.length)return toast('Tidak ada tabel di hasil ini. Pakai Word atau Cetak.',1);
 const wb=XLSX.utils.book_new();t.forEach((x,i)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.table_to_sheet(x),'Tabel '+(i+1)));
 XLSX.writeFile(wb,fname(m,'xlsx'));toast('Excel diunduh')}

const GS=`const SECRET = 'GANTI_DENGAN_KODE_RAHASIA_ANDA';
const NAMA = 'spena_sync.json';
function out(o){return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON)}
function doPost(e){
  const b = JSON.parse(e.postData.contents);
  if (b.secret !== SECRET) return out({ok:false, error:'Kode rahasia salah'});
  const it = DriveApp.getFilesByName(NAMA);
  const f = it.hasNext() ? it.next() : null;
  if (b.action === 'save') {
    const s = JSON.stringify(b.payload);
    if (f) f.setContent(s); else DriveApp.createFile(NAMA, s);
    return out({ok:true});
  }
  if (b.action === 'load') {
    return out({ok:true, payload: f ? JSON.parse(f.getBlob().getDataAsString()) : null});
  }
  return out({ok:false, error:'Aksi tidak dikenal'});
}`;
let pushT;
const syncCfg=()=>LS.get('spena_sync',null);
function schedPush(){const c=syncCfg();if(!c||!c.u||LS.mute)return;clearTimeout(pushT);pushT=setTimeout(()=>push(true),2500)}
function bundle(){const c=syncCfg()||{};const b={ts:+localStorage.getItem('spena_ts')||Date.now(),prof,data,auth:LS.get(K.auth,null),model:LS.get(K.model,'gemini-2.5-flash')};if(c.key)b.key=LS.get(K.key,'');return b}
async function sCall(action,payload){
 const c=syncCfg();if(!c||!c.u)throw new Error('URL sinkronisasi belum diisi');
 const r=await fetch(c.u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({secret:c.c,action,payload})});
 let j;try{j=await r.json()}catch(e){throw new Error('Respons bukan dari Apps Script. Pastikan akses deployment "Anyone" dan URL berakhiran /exec')}
 if(!j.ok)throw new Error(j.error||'Gagal');return j}
function sStat(t,e){const s=document.getElementById('sst');if(s){s.textContent=t;s.className='muted'+(e?' err':'')}}
async function push(quiet){
 try{const b=bundle();await sCall('save',b);localStorage.setItem('spena_ts',b.ts);LS.set('spena_last',Date.now());sStat('Terkirim ke cloud '+new Date().toLocaleTimeString('id-ID'));if(!quiet)toast('Data diunggah ke cloud')}
 catch(e){sStat(e.message,1);if(!quiet)toast(e.message,1);else toast('Sinkronisasi gagal: '+e.message,1)}}
async function pull(force){
 const j=await sCall('load');const p=j.payload;if(!p)return 'kosong';
 const lt=+localStorage.getItem('spena_ts')||0;if(!force&&p.ts<=lt)return 'sama';
 LS.mute=true;try{
  prof={...DEF,...p.prof};data=p.data||{};LS.set(K.prof,prof);LS.set(K.data,data);
  if(p.auth)LS.set(K.auth,p.auth);if(p.model)LS.set(K.model,p.model);if(p.key)LS.set(K.key,p.key);
  localStorage.setItem('spena_ts',p.ts)}finally{LS.mute=false}
 return 'baru'}
async function syncStart(){
 const c=syncCfg();if(!c||!c.u)return;
 try{const r=await pull(false);if(r==='baru'){toast('Data terbaru dari cloud dimuat');if(sessionStorage.getItem('spena_in')==='1')show()}}catch(e){toast('Sinkronisasi gagal: '+e.message,1)}}
(function(){const m=location.hash.match(/^#s=(.+)$/);if(!m)return;
 try{const o=JSON.parse(decodeURIComponent(escape(atob(m[1]))));LS.set('spena_sync',o);history.replaceState(null,'',location.pathname+location.search);
  sCall('load').then(()=>pull(true)).then(()=>{toast('Perangkat terhubung. Data dimuat dari cloud.');if(sessionStorage.getItem('spena_in')==='1')show()}).catch(e=>toast(e.message,1))}catch(e){}})();

/* ---------- Mulai ---------- */
async function boot(){
 const ok=sessionStorage.getItem('spena_in')==='1';
 $('#login').classList.toggle('hide',ok);$('#app').classList.toggle('hide',!ok);
 if(ok)show()}
$('#lf').onsubmit=async e=>{e.preventDefault();
 const a=LS.get(K.auth,null),u=$('#lu').value.trim(),h=await sha($('#lp').value);
 const good=a?(u===a.u&&h===a.h):(u==='feri'&&$('#lp').value==='spena.2026.');
 if(!good)return toast('Username atau password salah',1);
 sessionStorage.setItem('spena_in','1');$('#lp').value='';boot()};
boot();
syncStart();
</script>
