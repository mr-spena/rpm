<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mr.Spena Administration</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
:root{--ink:#16213e;--mute:#6b7694;--bg:#eef2fb;--card:#fff;--line:#dbe3f5;--soft:#f6f8fe;--blue:#0789df;--blue2:#006db6;--navy1:#3a0b4a;--navy2:#21052f;--err:#d64545;--ok:#22a35b;--r:18px}
*{box-sizing:border-box}
body{margin:0;font:14px/1.55 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
h1,h2,h3{line-height:1.25;margin:0;font-weight:800}h1{font-size:24px}h2{font-size:22px}h3{font-size:15px}
.muted{color:var(--mute);font-size:12.5px}.err{color:var(--err)}
label{display:block;font-weight:600;font-size:12px;margin:12px 0 5px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--soft);font-size:13px}
input::placeholder,textarea::placeholder{color:#9aa5c4}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,[contenteditable]:focus,a:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.btn{display:inline-block;border:0;background:var(--blue);color:#fff;padding:10px 18px;border-radius:10px;font-weight:700;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--blue2)}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.ghost:hover{background:var(--soft)}
.btn[disabled]{opacity:.55;cursor:wait}label.btn{margin:0;font-size:14px}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:16px}
.box{background:var(--card);border-radius:22px;padding:30px 28px;width:100%;max-width:380px;box-shadow:0 18px 50px rgba(32,58,134,.12)}
.brandrow{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.logo{display:grid;place-items:center;width:46px;height:46px;border-radius:15px;background:linear-gradient(145deg,#128ee0 0%,#0878c9 55%,#4a176f 100%);border:2px solid #f4cf16;box-shadow:0 5px 14px rgba(18,142,224,.25),inset 0 0 0 1px rgba(255,255,255,.28);color:#fff;font-weight:800;font-size:13px;letter-spacing:.5px;line-height:1;text-shadow:0 1px 2px rgba(0,0,0,.18)}
.brandrow b{display:block;font-size:17px;letter-spacing:.3px}.brandrow small{color:var(--mute);font-size:12px}
/* kerangka */
#app{display:grid;grid-template-columns:264px 1fr;gap:18px;padding:14px;min-height:100vh}
#nav{position:sticky;top:14px;height:calc(100vh - 28px);overflow:auto;border-radius:24px;padding:18px 14px;color:#dbe6ff;background:linear-gradient(180deg,var(--navy1),var(--navy2));scrollbar-width:thin;scrollbar-color:#3d5aa8 transparent}
#nav .brand{display:flex;align-items:center;gap:11px;padding:2px 6px 16px}
#nav .brand b{display:block;color:#fff;font-size:16px;letter-spacing:.4px}#nav .brand small{color:#9db4ec;font-size:11.5px}
#nav .sec{font-size:10.5px;letter-spacing:1.2px;font-weight:700;color:#8aa3e6;padding:16px 10px 6px}
#nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:0;color:inherit;padding:10px 12px;border-radius:12px;cursor:pointer;font-weight:600;font-size:13px;line-height:1.3}
#nav button:hover{background:rgba(255,255,255,.08)}
#nav button.on{background:var(--blue);color:#fff;box-shadow:0 6px 16px rgba(63,125,244,.45)}
#nav .ic{width:22px;text-align:center;font-size:16px;flex:none}
#nav .dot{margin-left:auto;width:8px;height:8px;border-radius:50%;background:#59d38e;flex:none}
.ct{min-width:0;padding:6px 8px 40px 0}
#hd{display:flex;align-items:center;gap:14px;padding:6px 0 18px;flex-wrap:wrap}
.ht{flex:1;min-width:200px}.ht p{margin:2px 0 0}
.hr{display:flex;align-items:center;gap:14px;font-size:13px}.hr .who{font-weight:700}.hr .lo{color:var(--err);font-weight:700;text-decoration:none}
.mb{display:none;border:1px solid var(--line);background:#fff;border-radius:10px;width:40px;height:40px;font-size:18px;cursor:pointer}
#scrim{display:none}
main{min-width:0}
.card{background:var(--card);border-radius:var(--r);padding:20px;margin-bottom:16px;box-shadow:0 2px 10px rgba(32,58,134,.05)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.banner{background:#fff4e2;border-radius:14px;padding:12px 16px;margin-bottom:16px}.banner a{color:var(--blue2);font-weight:700}
/* dashboard */
.hero{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding:30px 30px;border-radius:22px;margin-bottom:16px;background:linear-gradient(135deg,#d6e6ff,#e9f1ff 60%,#f2f7ff)}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:#cbeaff;z-index:0}
.hero:before{left:-50px;bottom:-78px;width:320px;height:130px}.hero:after{right:-40px;bottom:-84px;width:380px;height:140px;background:#e4d6eb}
.hero>*{position:relative;z-index:1}
.hero h2{font-size:26px;margin-bottom:6px}.hero p{margin:0 0 14px;max-width:460px;color:#44506f}
.chip{display:inline-block;background:#fff;border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px}
.dcard{background:#fff;border-radius:16px;padding:14px 18px;box-shadow:0 6px 20px rgba(32,58,134,.1);max-width:290px}
.dcard b{display:block;font-size:14px}.dcard i{display:block;margin-top:4px;font-size:12.5px;color:var(--mute)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px;margin-bottom:16px}
.mc{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-height:112px;padding:16px;border:0;border-radius:var(--r);color:#fff;text-align:left;cursor:pointer;box-shadow:0 8px 20px rgba(32,58,134,.16);transition:transform .15s}
.mc:hover{transform:translateY(-3px)}.mc .em{font-size:26px;line-height:1;margin-bottom:auto;padding-bottom:10px}.mc b{font-size:14px;line-height:1.25}.mc small{font-size:11.5px;opacity:.88}
.g0{background:linear-gradient(135deg,#8b5cf6,#6a3fd6)}.g1{background:linear-gradient(135deg,#4f8cf5,#2f6bdc)}.g2{background:linear-gradient(135deg,#0789df,#006db6)}.g3{background:linear-gradient(135deg,#f7b04a,#ee8a1e)}
.g4{background:linear-gradient(135deg,#ee6aa7,#d63d82)}.g5{background:linear-gradient(135deg,#6b2c7a,#3a0b4a)}.g6{background:linear-gradient(135deg,#6f77f2,#4b4ed8)}.g7{background:linear-gradient(135deg,#27bdd6,#0f93ab)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px}
.st{display:flex;align-items:center;gap:14px;background:#fff;border-radius:var(--r);padding:16px 18px;box-shadow:0 2px 10px rgba(32,58,134,.05)}
.st .ti{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;font-size:22px;flex:none}
.st b{display:block;font-size:26px;line-height:1.1;font-weight:800}.st span{font-size:12.5px;color:var(--mute)}.st>div{flex:1;min-width:0}
.bar{height:7px;border-radius:99px;background:#e3eafb;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#4f8cf5,#7fb0ff)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.pr{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #edf1fb;cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.pr .tag{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:#e8f0ff;color:var(--blue2);font-weight:800;flex:none}
.pr>div{flex:1;min-width:0}.pr b{display:block;font-size:13.5px}.pr small{color:var(--mute);font-size:12px}
.rc{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:11px 0;border-top:1px solid #edf1fb;cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.rc span{font-size:12px;color:var(--mute)}.rc small{color:var(--mute);font-size:12px;grid-column:1/-1}
/* hasil dokumen (tampilan kertas) */
#out{border:1px solid var(--line);border-radius:12px;padding:22px;background:#fff;min-height:120px;overflow-x:auto;font-family:"Times New Roman",serif;font-size:14px}
#out table{border-collapse:collapse;width:100%;margin:10px 0;font-size:13px}
#out th,#out td{border:1px solid #444;padding:5px 7px;vertical-align:top;text-align:left}#out th{background:#0789df;color:#fff}
#out h1,#out h2,#out h3{font-family:inherit;color:#3a0b4a}#out ol{padding-left:28px}#out ol>li{padding-left:5px;margin:0 0 7px;break-inside:avoid}#out ul{padding-left:28px}#out li{margin:0 0 5px}#out p{orphans:2;widows:2}#out p{margin:6px 0}
#out table.sig{border:0;width:100%;margin-top:30px}#out table.sig td{border:0;width:50%;padding:2px 4px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #fff6;border-top-color:#fff;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px}
@keyframes r{to{transform:rotate(360deg)}}
#toast{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:30}
#toast div{background:var(--ink);color:#fff;padding:10px 14px;border-radius:12px;max-width:340px}#toast .e{background:var(--err)}
@media(max-width:1100px){.two{grid-template-columns:1fr}}
@media(max-width:900px){
 #app{grid-template-columns:1fr;gap:0;padding:10px}
 #nav{position:fixed;z-index:20;left:10px;top:10px;bottom:10px;height:auto;width:270px;max-width:calc(100vw - 20px);transform:translateX(-120%);transition:transform .2s}
 body.nv #nav{transform:none}body.nv #scrim{display:block;position:fixed;inset:0;background:rgba(10,20,50,.45);z-index:15}
 .mb{display:block}.ct{padding:0 0 30px}.hdate{display:none}.hero{padding:22px 18px}.hero h2{font-size:21px}
}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}.mc,#nav{transition:none}}
#pv{display:none}
@media print{
html,body{background:#fff!important}
#app,#login,#toast,#scrim{display:none!important}
#pv{display:block;color:#000}
#pv .pw{width:100%;border-collapse:collapse;border:0}
#pv .pw>thead>tr>td,#pv .pw>tbody>tr>td,#pv .pw>tfoot>tr>td{border:0;padding:0}
}
</style>
</head>
<body>
<div id="login" class="hide"><form class="box" id="lf">
<div class="brandrow"><span class="logo">MSG</span><div><b>MR.SPENA</b><small>Mr. Spena Generator</small></div></div>
<label for="lu">Username</label><input id="lu" autocomplete="username" required>
<label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password" required>
<button class="btn" style="width:100%;margin-top:20px">Masuk</button></form></div>

<div id="app" class="hide">
<aside id="nav"></aside>
<div class="ct"><header id="hd"></header><main id="main"></main></div>
</div>
<div id="scrim" onclick="document.body.classList.remove('nv')"></div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const LS={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},mute:false,set:(k,v)=>{localStorage.setItem(k,JSON.stringify(v));if(!LS.mute&&SYNCK.includes(k)){localStorage.setItem('spena_ts',Date.now());schedPush()}}};
const K={prof:'spena_profil_v3',data:'spena_data_v3',key:'spena_apikey',model:'spena_model',auth:'spena_auth_v3'};
const SYNCK=[K.prof,K.data,K.auth,K.model,K.key];
const DEF={nama:'Feri Sujatmiko, S.Pd.',nip:'',sekolah:'SMPN 6 Blitar',mapel:'Bahasa Inggris',fase:'D',kelas:'VIII',ta:'2026/2027',kepsek:'Juli Setyanto, S.Pd., M.Pd.',nipKepsek:'',kota:'Blitar',jp:'4'};
let prof={...DEF,...LS.get(K.prof,{})}, data=LS.get(K.data,{}), tab='home', busy=false;

function toast(t,e){const d=document.createElement('div');if(e)d.className='e';d.textContent=t;$('#toast').append(d);setTimeout(()=>d.remove(),e?7000:3000)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('spena|'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

/* ---------- Modul ---------- */
const SYS=()=>`Anda adalah konsultan administrasi guru profesional SMP untuk Kurikulum Merdeka/Kurikulum Mendalam (Deep Learning) di Indonesia. Prioritaskan kesinambungan antarpertemuan, keterukuran tujuan, diferensiasi, asesmen formatif, serta integrasi literasi dan numerasi yang relevan dengan mata pelajaran. Tulis dalam Bahasa Indonesia baku (istilah mapel boleh Inggris). Patuhi regulasi: CP mengacu Keputusan BSKAP No. 046/H/KR/2025, istilah "murid", Dimensi Profil Lulusan (DPL). Keluaran WAJIB berupa Markdown: gunakan tabel Markdown untuk data tabular, jangan memakai blok kode, jangan menulis kalimat pembuka atau penutup, dan jangan menambahkan tanda tangan (sudah ditambahkan aplikasi). Jangan mengarang data kalender: jika data tidak cukup, tulis asumsi di baris "Catatan". GAYA TULIS WAJIB HUMANIS DAN NATURAL seperti dokumen guru profesional: gunakan kalimat sederhana, jelas, langsung, dan tidak terasa seperti keluaran AI. HINDARI LaTeX, simbol matematika bergaya kode, tanda dolar, backslash, panah Unicode, emoji, ikon, dekorasi, bullet aneh, dan karakter khusus yang tidak diperlukan. Jangan menulis pola seperti \text{}, \rightarrow, $, \( \), atau rumus dalam format LaTeX. Untuk rumus bahasa gunakan teks biasa, misalnya "Subject + Verb 2 + Complement". Jika perlu panah perubahan kata kerja, tulis dengan kata "menjadi". Gunakan tanda baca dan penomoran biasa. Hindari frasa generik seperti "tentu saja", "tentunya", "dengan demikian" berulang-ulang. Hasil harus terasa seperti ditulis guru SMP untuk dipakai langsung di kelas.
Identitas: Sekolah ${prof.sekolah}; Guru ${prof.nama}; Mapel ${prof.mapel}; Fase ${prof.fase}, Kelas ${prof.kelas}; Tahun Pelajaran ${prof.ta}; ${prof.jp} JP per minggu (1 JP = 40 menit).`;
const MODS=[
{id:'rpe',n:'1. Rincian Pekan Efektif',s:'RPE',desc:'Unggah kalender pendidikan (gambar, PDF, Excel, Word) atau ketik data libur/kegiatan.',
 f:[{k:'file',t:'file',l:'Kalender pendidikan (opsional)'},{k:'info',t:'area',l:'Libur / kegiatan tidak efektif (opsional)',ph:'Mis. MPLS 13-18 Juli, PTS 5-9 Okt, libur semester 21 Des-2 Jan'}],
 p:v=>`Susun Rincian Pekan Efektif (RPE) satu tahun pelajaran ${prof.ta}, dua tabel: "SEMESTER GANJIL" (Juli-Desember) dan "SEMESTER GENAP" (Januari-Juni). Kolom persis: NO | BULAN | JML PEKAN EFEKTIF | JML JAM EFEKTIF (= pekan efektif x ${prof.jp} JP). Akhiri tiap tabel dengan baris JUMLAH. Isi bulan dengan nama + tahun. ${v.info?'Informasi tambahan dari guru: '+v.info:''} Jika ada berkas kalender, hitung dari berkas itu. Jangan menulis catatan atau kalimat lain di luar dua tabel.`},
{id:'cp',n:'2. Capaian Pembelajaran',s:'CP',desc:'Rumusan CP per elemen untuk fase Anda, sesuai BSKAP 046/H/KR/2025.',
 f:[{k:'ref',t:'area',l:'Acuan / catatan guru (opsional)',ph:'Tempel potongan CP resmi atau tulis penekanan yang diinginkan'},{k:'file',t:'file',l:'Dokumen CP resmi (opsional)'}],
 p:v=>`Susun dokumen Capaian Pembelajaran ${prof.mapel} Fase ${prof.fase}: (A) Rasional singkat, (B) Tujuan mata pelajaran, (C) Karakteristik, (D) CP akhir fase per elemen (Menyimak-Berbicara, Membaca-Memirsa, Menulis-Mempresentasikan jika mapel Bahasa Inggris; sesuaikan elemen untuk mapel lain). ${v.ref?'Acuan guru: '+v.ref:''}`},
{id:'tp',n:'3. TP, ATP & Prota',s:'TP & Prota',desc:'Tujuan Pembelajaran, Alur, dan Program Tahunan dari RPE dan CP.',
 f:[{k:'materi',t:'area',l:'Materi/topik yang ingin dimasukkan (opsional)',ph:'Mis. Recount, Narrative, Descriptive, Imperative, Comparison'}],
 p:v=>`Susun CP, TP, ATP dan Prota kelas ${prof.kelas} dua semester. Urutan keluaran: (1) daftar poin Capaian Pembelajaran fase ${prof.fase}, satu poin per elemen, format "**Nama Elemen:** isi CP"; (2) SATU tabel dengan kolom persis: No | Elemen CP | Capaian Pembelajaran (CP) Turunan | Tujuan Pembelajaran (TP) | Alur/Materi Pokok | Alokasi Waktu (JP). Pakai data RPE dan CP yang diberikan sebagai batas total JP per semester (jumlah JP tabel harus sama dengan total JP efektif RPE). Tulis 3 TP bernomor "1. ... 2. ... 3. ..." dalam satu sel. Pisahkan semester dengan baris judul "SEMESTER 1 (GANJIL) - Total Alokasi Waktu: ... JP (... Minggu Efektif x ${prof.jp} JP)" dan "SEMESTER 2 (GENAP) - ..." (satu sel penuh, sel lain kosong). Sertakan baris Asesmen & Remedial tiap semester. ${v.materi?'Materi: '+v.materi:''} Jangan menulis kalimat lain.`},
{id:'kktp',n:'4. KKTP',s:'KKTP',desc:'Kriteria Ketercapaian Tujuan Pembelajaran untuk tiap TP: rubrik, deskripsi kriteria, atau interval nilai.',
 f:[{k:'model',t:'sel',l:'Model KKTP',o:['Rubrik 4 level','Deskripsi kriteria (tercapai / belum tercapai)','Interval nilai (0-100)']},{k:'sem',t:'sel',l:'Semester',o:['Ganjil','Genap','Ganjil dan Genap']},{k:'batas',t:'num',l:'Batas ketercapaian (nilai)',v:75},{k:'cat',t:'area',l:'Catatan guru (opsional)',ph:'Mis. tekankan kriteria keterampilan menulis'}],
 p:v=>`Susun Kriteria Ketercapaian Tujuan Pembelajaran (KKTP) semester ${v.sem}, model "${v.model}", batas ketercapaian nilai ${v.batas}. Ambil Tujuan Pembelajaran PERSIS dari data TP/ATP/Prota yang diberikan (jangan mengubah atau menambah TP). Tabel kolom: No | Tujuan Pembelajaran | ${v.model.startsWith('Rubrik')?'Indikator | Baru Berkembang | Layak | Cakap | Mahir (deskripsikan perilaku yang teramati di tiap level)':v.model.startsWith('Deskripsi')?'Kriteria Tercapai | Kriteria Belum Tercapai':'Interval Nilai | Deskripsi Ketercapaian (Perlu Bimbingan, Cukup, Baik, Sangat Baik)'} | Teknik Asesmen | Tindak Lanjut (remedial / pengayaan). Tegaskan di bawah tabel bahwa murid dinyatakan mencapai TP bila nilai >= ${v.batas}. ${v.cat?'Catatan guru: '+v.cat:''}`},
{id:'promes',n:'5. Program Semester',s:'Promes',desc:'Distribusi materi per bulan dan pekan, sinkron dengan RPE dan Prota.',
 f:[{k:'sem',t:'sel',l:'Semester',o:['Ganjil','Genap']}],
 p:v=>`Susun Program Semester (Promes) semester ${v.sem} dari data Prota dan RPE. Keluaran HANYA SATU tabel Markdown dengan kolom persis: No | Elemen CP | Tujuan Pembelajaran | Materi Pokok / Alur | JP | Pekan. Kolom Pekan berisi pekan efektif yang dipakai per bulan, format "Juli: 3-5; Agustus: 1-2" (pekan 1 sampai 5 tiap bulan, hanya bulan dalam semester ini). Tulis TP bernomor "1. ... 2. ..." dalam satu sel. Jumlah JP semua baris harus sama dengan total JP efektif RPE semester ${v.sem} dan sinkron dengan Prota. Jangan menulis kalimat lain.`},
{id:'rpm',n:'6. RPM & Lampiran',s:'RPM',desc:'RPM inti pembelajaran mendalam: runtut antarpertemuan, terintegrasi literasi-numerasi, dan siap diekspor sesuai template sekolah.',
 f:[
  {k:'materi',t:'text',l:'Materi / topik',ph:'Mis. Recount Text – Personal Holiday Experience'},
  {k:'unit',t:'text',l:'Unit / rangkaian pembelajaran',ph:'Mis. Recount Text Unit 1'},
  {k:'pert',t:'text',l:'Pertemuan ke-',v:'1'},
  {k:'totalPert',t:'num',l:'Target jumlah pertemuan unit',v:4},

async function fileParts(f){
 if(!f)return[];
 const n=f.name.toLowerCase(),buf=await f.arrayBuffer();
 if(f.type.startsWith('image/')||f.type==='application/pdf'){
  let b='';const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=8192)b+=String.fromCharCode(...u.subarray(i,i+8192));
  return[{inlineData:{mimeType:f.type,data:btoa(b)}}]}
 if(/\.(xlsx|xls|csv)$/.test(n)){const wb=XLSX.read(buf);return[{text:'Isi berkas Excel '+f.name+':\n'+wb.SheetNames.map(s=>'## '+s+'\n'+XLSX.utils.sheet_to_csv(wb.Sheets[s])).join('\n')}]}
 if(/\.docx$/.test(n)){const r=await mammoth.extractRawText({arrayBuffer:buf});return[{text:'Isi berkas Word '+f.name+':\n'+r.value}]}
 if(/\.(txt|md)$/.test(n))return[{text:await f.text()}];
 throw new Error('Format berkas '+f.name+' belum didukung. Pakai gambar, PDF, Excel, Word (.docx), atau txt.')}
async function callAI(parts){
 const key=LS.get(K.key,'');if(!key)throw new Error('API key Gemini belum diisi. Buka Pengaturan, tempel API key dari Google AI Studio.');
 const model=LS.get(K.model,'gemini-2.5-flash');
 const url='https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent';
 const body=JSON.stringify({systemInstruction:{parts:[{text:SYS()}]},contents:[{role:'user',parts}],generationConfig:{temperature:.6,maxOutputTokens:32768}});
 let last;
 for(let i=0;i<3;i++){
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body});
  if(r.ok){const j=await r.json();const t=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');if(!t)throw new Error('AI tidak mengembalikan teks'+(j.promptFeedback?.blockReason?' (diblokir: '+j.promptFeedback.blockReason+')':'')+'. Coba ulangi.');return t}
  let m='';try{m=(await r.json()).error?.message||''}catch(e){}
  last=new Error('Gemini menolak permintaan ('+r.status+'): '+m);
  if(r.status!==429&&r.status<500)throw last;
  await new Promise(s=>setTimeout(s,1500*(i+1)))}
 throw last}

/* ---------- Markdown, konteks, tanda tangan ---------- */
function cleanAIText(s){
 s=String(s||'').replace(/\r/g,'');
 s=s.replace(/\$([^$\n]+)\$/g,'$1');
 s=s.replace(/\\text\s*\{([^{}]*)\}/g,'$1').replace(/\\mathrm\s*\{([^{}]*)\}/g,'$1');
 s=s.replace(/\\rightarrow|\\to|→|⇒|⟶/g,' menjadi ');
 s=s.replace(/\\times|×/g,' x ');
 s=s.replace(/\\geq|≥/g,' >= ').replace(/\\leq|≤/g,' <= ');
 s=s.replace(/\\pm|±/g,' +/- ');
 s=s.replace(/\\left|\\right/g,'');
 s=s.replace(/\\\(|\\\)|\\\[|\\\]/g,'');
 s=s.replace(/[ \t]{2,}/g,' ');
 // Rapikan tanda dekoratif yang sering muncul dari keluaran AI.
 s=s.replace(/[✨⭐🌟📌📚🎯📝🔹🔸]/g,'');
 s=s.replace(/^\s*[•▪◦◆◇]+\s*/gm,'');
 return s.trim();
}
function md(s){
 s=cleanAIText(s);
 s=s.replace(/^```\w*\n?|```$/gm,'').trim();const L=s.split('\n');let o='',i=0;
 const inl=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*(?!\s)(.+?)\*/g,'$1<i>$2</i>').replace(/&lt;br\s*\/?&gt;/g,'<br>');
 const cells=l=>l.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
 while(i<L.length){const l=L[i];
  if(/^\s*\|/.test(l)&&/^\s*\|?\s*:?-{2,}/.test(L[i+1]||'')){
   const h=cells(l);i+=2;let rows=[];while(i<L.length&&/^\s*\|/.test(L[i]))rows.push(cells(L[i++]));
   o+='<table><thead><tr>'+h.map(c=>'<th>'+inl(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>{
     const only=r.filter(Boolean);const sp=only.length===1&&r.length>2&&r[0];
     return sp?'<tr><td colspan="'+h.length+'"><b>'+inl(r[0])+'</b></td></tr>':'<tr>'+h.map((_,k)=>'<td>'+inl(r[k]||'')+'</td>').join('')+'</tr>'}).join('')+'</tbody></table>';continue}
  let m;
  if(m=l.match(/^(#{1,4})\s+(.*)/)){o+='<h'+Math.min(m[1].length+1,4)+'>'+inl(m[2])+'</h'+Math.min(m[1].length+1,4)+'>'}
  else if(/^\s*([-*]|\d+[.)])\s+/.test(l)){const ord=/^\s*\d/.test(l);let it='';while(i<L.length&&/^\s*([-*]|\d+[.)])\s+/.test(L[i]))it+='<li>'+inl(L[i++].replace(/^\s*([-*]|\d+[.)])\s+/,''))+'</li>';o+=(ord?'<ol>':'<ul>')+it+(ord?'</ol>':'</ul>');continue}
  else if(/^\s*---+\s*$/.test(l)){o+='<hr>'}
  else if(l.trim()){o+='<p>'+inl(l)+'</p>'}
  i++}
 return o}

  f.t==='sel'?'<select id="'+id+'">'+f.o.map(o=>'<option>'+esc(o)+'</option>').join('')+'</select>':
  f.t==='file'?'<input type="file" id="'+id+'" accept="image/*,.pdf,.xlsx,.xls,.csv,.docx,.txt">':
  '<input id="'+id+'" type="'+(f.t==='num'?'number':'text')+'" value="'+esc(v)+'" placeholder="'+esc(f.ph||'')+'">')+'</div>'};
 const d=data[m.id];
 $('#main').innerHTML=noKey()+'<div class="card form noprint"><h3 style="margin-bottom:4px">Isi data dokumen</h3><div class="grid">'+m.f.map(fld).join('')+'</div><div class="row" style="margin-top:14px"><button class="btn" id="go">'+(d?'Susun ulang dengan AI':'Susun dengan AI')+'</button>'+(m.id==='rpm'&&d?'<button class="btn ghost" id="nextRpm">➜ Buat Pertemuan Berikutnya</button>':'')+'<span class="muted" id="st"></span></div></div>'+

 (m.id==='rpm'&&data.rpmHistory?.length?'<div class="card noprint"><h3>Riwayat Rangkaian RPM</h3><p class="muted">Setiap RPM tersimpan sebagai pertemuan tersendiri. Pilih <b>Buka</b> untuk mengakses kembali RPM lama atau <b>Lanjutkan</b> untuk menjadikannya pijakan pertemuan berikutnya.</p>'+data.rpmHistory.map((x,i)=>'<div class="pr" style="align-items:center"><span class="tag">'+esc(x.pert||'?')+'</span><div style="flex:1"><b>Pertemuan '+esc(x.pert||'?')+(x.unit?' · '+esc(x.unit):'')+'</b><small>'+esc(x.materi||'')+' · '+(x.ts?new Date(x.ts).toLocaleString('id-ID'):'')+'</small></div><button class="btn ghost rpmOpen" data-rpm-ts="'+esc(x.ts||'')+'">Buka</button><button class="btn ghost rpmNextHist" data-rpm-ts="'+esc(x.ts||'')+'">Lanjutkan</button></div>').join('')+'</div>':'')+
 '<div class="card"><div class="row noprint" style="margin-bottom:10px"><h3 style="margin:0;flex:1">Hasil <span class="muted">(klik teks untuk mengedit; tersimpan otomatis)</span></h3><button class="btn ghost" id="xw">Word</button><button class="btn ghost" id="xx">Excel</button><button class="btn ghost" id="xp">Cetak / PDF</button><button class="btn ghost" id="xc">Salin</button></div><div id="out" contenteditable="true">'+(d?d.html:'<p class="muted">Belum ada hasil. Isi form di atas lalu tekan tombol Susun dengan AI.</p>')+'</div></div>';
 const out=$('#out');
 out.oninput=()=>{const c=out.cloneNode(true);c.querySelector('.sig')?.remove();data[m.id]={...(data[m.id]||{}),html:c.innerHTML.replace(/<p style="text-align:center">.*?<\/p>/,'')};if(!data[m.id].html)return;LS.set(K.data,data)};
 if(d&&!d.html.includes('class="sig"')){}
 $('#go').onclick=async()=>{
  if(busy)return;busy=true;const b=$('#go');b.disabled=true;b.innerHTML='<span class="spin"></span> AI bekerja…';$('#st').textContent='Biasanya 20-90 detik, jangan tutup halaman.';
  try{
   const v={};m.f.forEach(f=>{const e=$('#f_'+f.k);v[f.k]=f.t==='file'?e.files[0]:e.value});
   const fp=await fileParts(v.file);
   const text=await callAI([{text:m.p(v)+ctx(m.id)},...fp]);
   data[m.id]={html:md(text),ts:Date.now(),sem:v.sem,materi:v.materi,alok:v.wkt?(v.wkt+(v.pert?' (Pertemuan '+v.pert+')':'')):'',pert:v.pert,totalPert:v.totalPert,unit:v.unit,continuity:v.continuity,lit:v.lit,litfocus:v.litfocus,prev:v.prev,nextSuggested:(v.pert&&v.totalPert&&+v.pert<+v.totalPert)?('Pertemuan '+(+v.pert+1)):''};
    if(m.id==='rpm'){data.rpmHistory=data.rpmHistory||[];data.rpmHistory=data.rpmHistory.filter(x=>x.ts!==data.rpm.ts);data.rpmHistory.unshift({...data.rpm});data.rpmHistory=data.rpmHistory.slice(0,20);}
    LS.set(K.data,data);
   out.innerHTML=head(m)+data[m.id].html+sig();nav();toast('Selesai. Periksa isinya lalu edit seperlunya.')
  }catch(e){toast(e.message,1);$('#st').textContent=''}
  finally{busy=false;b.disabled=false;b.textContent='Susun ulang dengan AI'}};
 if(d)out.innerHTML=head(m)+d.html+sig();
 $('#xw').onclick=()=>exportWord(m);$('#xx').onclick=()=>exportExcel(m);$('#xp').onclick=()=>doPrint(m);
 $('#xc').onclick=()=>navigator.clipboard.writeText(out.innerText).then(()=>toast('Teks disalin'));
 if(m.id==='rpm'){
  document.querySelectorAll('.rpmOpen').forEach(b=>b.onclick=()=>{
   const x=(data.rpmHistory||[]).find(z=>String(z.ts)===b.dataset.rpmTs);if(!x)return;
   data.rpm={...x};LS.set(K.data,data);module(m);toast('RPM Pertemuan '+(x.pert||'?')+' dibuka kembali.');
  });
  document.querySelectorAll('.rpmNextHist').forEach(b=>b.onclick=()=>{
   const x=(data.rpmHistory||[]).find(z=>String(z.ts)===b.dataset.rpmTs);if(!x)return;
   data.rpm={...x};LS.set(K.data,data);module(m);
   setTimeout(()=>$('#nextRpm')?.click(),50);
  });
 }
 if(m.id==='rpm'&&d)$('#nextRpm').onclick=()=>{

  window.scrollTo({top:0,behavior:'smooth'});
 };
}

const X=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const r_=(x,o={})=>({x,...o});
const p_=(runs,o={})=>({t:'p',runs:typeof runs==='string'?[{x:runs}]:runs,...o});
const tbl_=(grid,rows,o={})=>({t:'tbl',grid,rows,...o});
const c_=(ps,o={})=>({ps:(Array.isArray(ps)?ps:[ps]).map(x=>typeof x==='string'?p_(x):x),...o});

/* tabel borderless dua kolom label : isi (identitas) */

    else pushText([{x:(x.ord?i+1+'.':'')+'\t'},...(it.runs||[{x:t}])],null,{il:465,hang:360,sa:55});
   });continue;
  }
  if(x.k==='t')body.push(gTbl_(x.rows,9072,{font:F,sz,hdrFill:'0789DF',secFill:'DCEEFF',hdrH:0}),p_('',{}));
 }
 if(answers.length && mode!=='exam'){body.push(p_('KUNCI JAWABAN PILIHAN GANDA',{b:true,color:'3A0B4A',sb:160,sa:70,font:F,sz}));body.push(p_(answers.join('     '),{font:F,sz,sa:100}));}
}

B.media=n=>{const body=[p_('MEDIA PEMBELAJARAN',{al:'center',b:true,sa:120})];
 n.forEach(x=>{if(x.k==='h')body.push(p_(x.text,{b:true,sb:120,sa:60,keep:true}));else if(x.k==='p')body.push(p_(x.runs,{al:'both',line:276,sa:80}));else if(x.k==='l')x.items.forEach((it,k)=>body.push(p_([{x:(x.ord?(k+1)+'.':'•')+'\t'},...it.runs],{il:465,hang:360,al:'both'})));else if(x.k==='t')body.push(gTbl_(x.rows,9072,{hdrH:0}),p_('',{}))});
 return{page:pgA4(1701,1134,1134,1701),font:'Arial',sz:22,body}};
B.lkpd=n=>{const F='Arial',sz=22,body=[p_('LEMBAR KERJA PESERTA DIDIK (LKPD)',{al:'center',b:true,color:'3A0B4A',sa:120}),kv_([['Sekolah',prof.sekolah],['Mata Pelajaran',prof.mapel],['Kelas',prof.kelas],['Tahun Pelajaran',prof.ta]],[2200,200,6100],{bl:true,bv:true}),p_('',{})];
 appendAssessment_(body,n,F,sz,'worksheet');body.push(p_('',{}),sig_([4536,4538],F,22,{al:'left',gap:900}));return{page:pgA4(1701,1134,1134,1701),font:F,sz,body}};
 B.sumatif=n=>{const F='Arial',sz=22,body=[...cover_('', ['NASKAH SOAL ASESMEN / SUMATIF','KURIKULUM MENDALAM']),p_('NASKAH SOAL ASESMEN / SUMATIF',{al:'center',b:true,color:'3A0B4A',sa:100,font:F,sz}),kv_([['Sekolah',prof.sekolah],['Mata Pelajaran',prof.mapel],['Kelas',prof.kelas],['Tahun Pelajaran',prof.ta]],[2200,200,6100],{bl:true,bv:true}),p_('',{})];
 appendAssessment_(body,n,F,sz,'exam');return{page:pgA4(1134,1134,1134,1134),font:F,sz,body}};
const bGen_=B.lkpd||B.sumatif;
function buildIR(m){const n=nodesOf_(m.id);const ir=(B[m.id]||bGen_)(n,m);return ir}
function exportWord(m){dl(toDocx_(buildIR(m)),fname(m,'docx'));toast('Word (.docx) diunduh. Kertas, font, dan tabel mengikuti template sekolah.')}
function doPrint(m){const ir=buildIR(m);toast('Di jendela cetak pilih "Simpan sebagai PDF" atau printer. Biarkan Margin: Default.');printIR_(ir,fname(m,'x').replace(/\.x$/,''))}
async function exportExcel(m){const ir=buildIR(m);if(!ir.body.some(b=>b.t==='tbl'))return toast('Tidak ada tabel di hasil ini. Pakai Word atau PDF.',1);
 const ok=await toXlsx_(ir,fname(m,'xlsx'),m.s);if(ok)toast('Excel diunduh. Font, warna, dan lebar kolom mengikuti template.');else{toXlsHtml_(ir,fname(m,'xls'));toast('Excel diunduh (mode cadangan karena library Excel tidak termuat).')}}

const GS=`const SECRET = 'GANTI_DENGAN_KODE_RAHASIA_ANDA';
const NAMA = 'spena_sync.json';
function out(o){return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON)}
function doPost(e){
  const b = JSON.parse(e.postData.contents);
  if (b.secret !== SECRET) return out({ok:false, error:'Kode rahasia salah'});
  const it = DriveApp.getFilesByName(NAMA);
  const f = it.hasNext() ? it.next() : null;
  if (b.action === 'save') {
    const s = JSON.stringify(b.payload);
    if (f) f.setContent(s); else DriveApp.createFile(NAMA, s);
    return out({ok:true});
  }
  if (b.action === 'load') {
    return out({ok:true, payload: f ? JSON.parse(f.getBlob().getDataAsString()) : null});
  }
  return out({ok:false, error:'Aksi tidak dikenal'});
}`;
let pushT;
const syncCfg=()=>LS.get('spena_sync',null);
function schedPush(){const c=syncCfg();if(!c||!c.u||LS.mute)return;clearTimeout(pushT);pushT=setTimeout(()=>push(true),2500)}
function bundle(){const c=syncCfg()||{};const b={ts:+localStorage.getItem('spena_ts')||Date.now(),prof,data,auth:LS.get(K.auth,null),model:LS.get(K.model,'gemini-2.5-flash')};if(c.key)b.key=LS.get(K.key,'');return b}
async function sCall(action,payload){
 const c=syncCfg();if(!c||!c.u)throw new Error('URL sinkronisasi belum diisi');
 const r=await fetch(c.u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({secret:c.c,action,payload})});
 let j;try{j=await r.json()}catch(e){throw new Error('Respons bukan dari Apps Script. Pastikan akses deployment "Anyone" dan URL berakhiran /exec')}
 if(!j.ok)throw new Error(j.error||'Gagal');return j}
function sStat(t,e){const s=document.getElementById('sst');if(s){s.textContent=t;s.className='muted'+(e?' err':'')}}
async function push(quiet){
 try{const b=bundle();await sCall('save',b);localStorage.setItem('spena_ts',b.ts);LS.set('spena_last',Date.now());sStat('Terkirim ke cloud '+new Date().toLocaleTimeString('id-ID'));if(!quiet)toast('Data diunggah ke cloud')}
 catch(e){sStat(e.message,1);if(!quiet)toast(e.message,1);else toast('Sinkronisasi gagal: '+e.message,1)}}
async function pull(force){
 const j=await sCall('load');const p=j.payload;if(!p)return 'kosong';
 const lt=+localStorage.getItem('spena_ts')||0;if(!force&&p.ts<=lt)return 'sama';
 LS.mute=true;try{
  prof={...DEF,...p.prof};data=p.data||{};LS.set(K.prof,prof);LS.set(K.data,data);
  if(p.auth)LS.set(K.auth,p.auth);if(p.model)LS.set(K.model,p.model);if(p.key)LS.set(K.key,p.key);
  localStorage.setItem('spena_ts',p.ts)}finally{LS.mute=false}
 return 'baru'}
async function syncStart(){
 const c=syncCfg();if(!c||!c.u)return;
 try{const r=await pull(false);if(r==='baru'){toast('Data terbaru dari cloud dimuat');if(sessionStorage.getItem('spena_in')==='1')show()}}catch(e){toast('Sinkronisasi gagal: '+e.message,1)}}
(function(){const m=location.hash.match(/^#s=(.+)$/);if(!m)return;
 try{const o=JSON.parse(decodeURIComponent(escape(atob(m[1]))));LS.set('spena_sync',o);history.replaceState(null,'',location.pathname+location.search);
  sCall('load').then(()=>pull(true)).then(()=>{toast('Perangkat terhubung. Data dimuat dari cloud.');if(sessionStorage.getItem('spena_in')==='1')show()}).catch(e=>toast(e.message,1))}catch(e){}})();

/* ---------- Mulai ---------- */
async function boot(){
 const ok=sessionStorage.getItem('spena_in')==='1';
 $('#login').classList.toggle('hide',ok);$('#app').classList.toggle('hide',!ok);
 if(ok)show()}
$('#lf').onsubmit=async e=>{e.preventDefault();
 const a=LS.get(K.auth,null),u=$('#lu').value.trim(),h=await sha($('#lp').value);
 const good=a?(u===a.u&&h===a.h):(u==='feri'&&$('#lp').value==='spena.2026.');
 if(!good)return toast('Username atau password salah',1);
 sessionStorage.setItem('spena_in','1');$('#lp').value='';boot()};
boot();
syncStart();
